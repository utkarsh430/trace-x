[project]
name = "trace-x"
version = "0.1.0"
description = "TRACE-X — real-time fraud detection and autonomous multi-agent investigation platform"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Phase 0 bootstrap must work with NO paid AWS / Databricks / LLM access.
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  # Tracing is not optional: `trace_core.observability` injects trace_id into
  # every structured log line, so the API and SDK are core. Only the OTLP
  # exporter (which pulls in grpc) lives in the `obs` extra and is imported
  # lazily, so a process with no collector configured never pays for it.
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
# --- installed per phase; keep bootstrap small (disk is a constrained resource) ---
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
# psycopg-pool is separate from psycopg and is not optional for the gateway:
# a connection per request cannot meet a 100 ms p99, and opening one under load
# is how a database outage turns into a connection storm.
# hiredis is redis-py's C protocol parser, and it is not a micro-optimisation
# here: a CPU profile of the hot path put ~2.7 ms of the ~3.0 ms of CPU per
# scored request inside the pure-Python RESP reader, because one snapshot parses
# hundreds of returned values. Installing it swaps that reader for a C one --
# same protocol, same values, no code change -- and measured 21.6% off CPU per
# request. See ADR-0038.
db = [
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "psycopg-pool>=3.2",
  "redis>=5.0", "hiredis>=3.0",
  # SQLAlchemy requires greenlet on x86_64 and aarch64 Linux but not on arm64 macOS, so a lock
  # compiled on a Mac silently omitted it and every Linux install failed `pip check`. Declared
  # directly so the lock carries it on every platform; guarded by
  # test_the_lock_is_complete_on_every_platform_it_is_installed_on (ADR-0045).
  "greenlet>=3.0",
]
# Phase 3. Installed everywhere from the hashed lock (ADR on the Phase 3 toolchain
# contract): mypy's scope imports pyspark, and a Spark test that runs only on some
# machines is a Spark test that silently does not run. The JVM jars these need are
# pinned separately, by SHA-256, in packages/trace_core/stream/jars.lock.
stream = ["pyspark==4.0.1", "delta-spark==4.0.1", "confluent-kafka>=2.4,<3"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.4", "pandas>=2.2", "numpy>=1.26", "mlflow>=2.12", "shap>=0.45"]
agents = ["langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=2.0", "mcp>=1.2", "boto3>=1.34", "openai>=1.30"]
graph = ["neo4j>=5.19"]
# Phase 1 generation + contracts: Parquet output for the frozen dataset and
# JSON-Schema validation at produce time (ADR-0027, ADR-0030).
gen = ["pyarrow>=16", "jsonschema>=4.21"]
# The Prometheus reader attaches to the SAME meter provider the application
# writes to, so /metrics serves those instruments rather than a parallel set.
obs = [
  "opentelemetry-exporter-otlp>=1.24", "opentelemetry-instrumentation-fastapi>=0.45",
  "opentelemetry-exporter-prometheus>=0.45b0", "prometheus-client>=0.20",
]
dev = [
  "pytest>=8.1", "pytest-cov>=5.0", "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  # `make lock` regenerates requirements.lock. It was only ever present in
  # environments that had installed it by hand, so a clean install from the lock
  # could not regenerate the lock.
  "pip-tools>=7.4",
  "ruff>=0.4", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7",
  "detect-secrets>=1.5",
  "datamodel-code-generator>=0.25",
  "types-jsonschema>=4.21",   # contract tests validate the committed schemas
  "types-PyYAML>=6.0",        # rule packs are YAML and are parsed in typed code
  # Phase 2: property-based contract testing against the committed OpenAPI
  # (docs/TESTING.md §3). It drives the real app, so it lives in `dev` rather
  # than `api` -- CI runs it, a deployment never does.
  "schemathesis>=3.25,<4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]

# PEP 561: `trace_core` ships inline type information. Without the marker,
# anything importing it from outside the source tree (mypy resolving the
# editable install, a future service package, a consumer of the wheel) silently
# treats it as untyped -- which would quietly void "mypy is strict on trace_core".
[tool.setuptools.package-data]
# The rule packs ship WITH the package: they are behaviour, not documentation.
# A wheel whose rules had to be supplied separately would be a gateway that
# cannot boot, and the pack digest recorded on every decision would resolve to
# nothing (ADR-0034).
trace_core = ["py.typed", "rules/packs/*.yaml", "scoring/config/*.yaml", "stream/jars.lock"]

# ----------------------------------------------------------------------------
# Version pin matrix (ADR-0018). `make doctor` asserts these at runtime.
# Changing any value invalidates prior benchmark comparability and REQUIRES a
# manifest-diff note in the next evaluation report (docs/EVALUATION.md).
# ----------------------------------------------------------------------------
[tool.trace_x.pins]
python = "3.12"
java = "17"           # Temurin 17 — Spark 4.0 supports Java 17/21 only
spark = "4.0.1"
delta = "4.0.1"
hadoop = "3.4"        # Delta 4.0.1 + Spark 4.0.1 require Hadoop 3.4.x
scala = "2.13"

# ----------------------------------------------------------------------------
# Non-Python tooling, pinned as container images (ADR-0036).
#
# These are gates and measurement instruments, so an unpinned version would
# silently change either what CI rejects or what a benchmark reports. Pinned by
# tag AND digest: a tag can be moved, a digest cannot. Delivered as images rather
# than as binaries on PATH so no developer's globally-installed version can
# disagree with CI's -- the same reasoning that put Python dependencies in a
# hashed lockfile.
# ----------------------------------------------------------------------------
[tool.trace_x.tools]
oasdiff = "tufin/oasdiff:v1.11.7@sha256:d6f1e645251cc1da527311955347d8ce8bd2b7ed09bcce07176b2577b8daf19c"
k6 = "grafana/k6:0.49.0@sha256:8cd78f9d0de5f50bc8821cceecf356d5d9e839e6611c226a3fcf13c591080fbd"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "scripts", "tests", "eval", "mcp_servers", "data", "services", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "S", "T20"]
ignore = ["S101"]  # assert is expected in tests and in invariant guards

[tool.ruff.lint.per-file-ignores]
# Test harnesses intentionally resolve `docker`/`psql` from PATH (S607) and use
# throwaway local credentials (S105/S106).
# S311: seeded `random.Random` is the requirement in determinism tests, not a
# weakness -- tests never perform cryptography. Production code centralises RNG
# construction in one place rather than suppressing per call site (ADR-0027).
# S608: integration tests build SQL from literals and parametrize values
# (a table name from a fixed list, an integer id the database returned).
# There is no input to inject; production SQL avoids interpolation entirely.
"tests/**" = ["ARG", "S105", "S106", "S311", "S607", "S608"]
# T201: a load test exists to report a measurement, and a measurement that
# is never printed is one nobody reads. Scoped to tests/load/ rather than
# all tests, so an accidental debug print elsewhere is still caught.
"tests/load/**" = ["ARG", "S105", "S106", "S311", "S607", "S608", "T201"]
# T201: a chaos test that swallows a teardown error silently is how a broken
# fixture hides the assertion failure that led to it. Printing the reason is the
# minimum, and scoped to tests/chaos/ so a stray debug print elsewhere is still
# caught.
"tests/chaos/**" = ["ARG", "S105", "S106", "S311", "S607", "S608", "T201"]
"scripts/**" = ["T20"]   # CLI tooling prints by design
# The evaluation harness is a CLI whose OUTPUT is the deliverable: a manual
# validation nobody can read is not a validation (ROADMAP Phase 2).
"eval/**" = ["T20"]
# A benchmark exists to report a measurement, and a measurement nobody prints is
# one nobody reads (T201). S311: the load generator is deliberately seeded so a
# run reproduces -- that is the requirement, not a weakness, and it performs no
# cryptography. Same reasoning already applied to tests/load/.
"benchmarks/**" = ["T201", "S311"]
# Generated by `make codegen` from docs/contracts/events/*.json and never
# hand-edited (a CI drift gate proves it), so inline suppressions are
# impossible. E501: schema `description` text becomes a docstring verbatim, and
# truncating it would make the contract less clear to win a lint. S105: enum
# members named PASSWORD_CHANGE / TOKEN are event names, not credentials.
"packages/trace_core/contracts/events/**" = ["E501", "S105"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
# `eval` joined the scope in Phase 2, when it gained its first Python module:
# the replay harness is the only code that reads ground truth, which makes it
# the last place an untyped mistake should be allowed to hide.
files = ["packages", "scripts", "tests", "migrations", "data", "services", "benchmarks", "eval"]
# `tests/conformance/` is a real package (it holds shared suites that concrete
# test modules subclass), while `tests/` itself is not. Without an explicit base
# mypy cannot decide whether that file is `source_adapter_suite` or
# `tests.conformance.source_adapter_suite` and refuses to check anything.
explicit_package_bases = true
# Two bases: `packages/` (so trace_core.* resolves from source, not from the
# editable install) and the repo root (so data.* and tests.conformance.* do).
mypy_path = "packages:."

# Phase-gated optional dependencies. Each is imported INSIDE a function and
# guarded by a MissingDependencyError that names the extra, so absence is a loud,
# actionable failure rather than a silent degradation. They are not installed
# until their phase, so mypy cannot see them -- and must not be told they are
# required, which would make `make setup` install the whole stack on day one.
# Modules that are genuinely required stay in test_toolchain_consistency's
# SCOPE_REQUIREMENTS, which asserts they are installed everywhere mypy runs.
[[tool.mypy.overrides]]
# Listed as they are actually referenced; mypy warns about unused sections,
# so pyspark and delta join this list in Phase 3 rather than pre-emptively.
module = ["confluent_kafka.*"]
ignore_missing_imports = true

# pyarrow ships no py.typed marker, so mypy cannot see its types even though it
# IS installed (the `gen` extra). Distinct from the block above: that one is
# about dependencies deliberately absent until their phase; this one is about a
# present dependency that simply is not typed.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# trace_core is the domain core: strict typing is non-negotiable there.
[[tool.mypy.overrides]]
module = "trace_core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: fast, no external services",
  "property: hypothesis-driven invariants",
  "contract: API/event contract conformance",
  "conformance: port/adapter shared suites",
  "integration: requires real services via testcontainers/compose",
  "parity: online-vs-offline feature parity",
  "transport_parity: MCP vs in-process tool behaviour equivalence",
  "adversarial: prompt-injection and authz-bypass corpora",
  "security: authorization, isolation and least-privilege controls",
  "e2e: full compose stack, no mocks permitted",
  "load: performance measurement",
  "chaos: fault injection",
  "external: requires the IEEE-CIS dataset (Track B); skipped loudly when absent",
  "cloud: requires AWS/Databricks credentials",
  "slow: excluded from test-fast",
  "stream: requires the Phase 3 JVM toolchain (Java 17, pyspark, verified jars); skipped loudly without it, and a -m stream session that runs none fails",
]

[tool.coverage.run]
source = ["packages/trace_core"]
branch = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# Gate on MEDIUM severity and above (`-ll`). The three LOW findings in this repo
# are verified false positives, and blanket-suppressing their rule ids would hide
# real instances later:
#   B105 scripts/acceptance.py  - an ANSI colour code matched the "hardcoded
#                                 password" heuristic because its dict key is "PASS"
#   B404/B603 scripts/doctor.py - subprocess is intentional; every argument is a
#                                 fixed literal, never user input
#   B310 scripts/ci_status.py   - annotated inline with `# nosec B310`: constant
#                                 https template, regex-validated slug and sha,
#                                 explicit scheme assertion before the call
# Run `make audit-full` (bandit without -ll) to see LOW findings again.
