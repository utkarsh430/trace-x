name: test-integration

# Real services, never mocks (docs/TESTING.md §4). This workflow runs the
# release-blocking ground-truth isolation suite against a real PostgreSQL.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,obs]"

      # Docker is available on ubuntu-latest, so the suite manages its own
      # PostgreSQL container exactly as it does locally -- one code path.
      - name: Integration suite (incl. ground-truth isolation)
        run: pytest -m integration -v

      - name: Ground-truth isolation is a release blocker
        if: failure()
        run: |
          echo "::error::Integration suite failed. If the ground-truth isolation"
          echo "::error::tests are among them, DO NOT merge: ground truth reaching"
          echo "::error::an agent silently invalidates every metric (ADR-0004)."
          exit 1
