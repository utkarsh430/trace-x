name: test-stream

# Phase 3: the Spark / Delta / Kafka tests, on the pinned JVM toolchain.
#
# A separate job because it needs Temurin 17 and the verified jars, which no other
# job installs. It is not optional: a Spark test that skipped would look exactly
# like one that passed, so the session FAILS if no stream-marked test executed
# (tests/conftest.py). tests/unit/test_toolchain_consistency.py asserts that this
# workflow installs the Java version pinned in pyproject.toml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-stream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    # One JVM per test file, run in sequence: about 35 min locally, slower on a hosted runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies from the hashed locks
        run: bash scripts/install_locked.sh python

      # Keyed by the lock's digest: a changed pin is a cache miss, never a stale jar.
      # A restored jar is still re-verified byte for byte by the next step.
      - name: Restore verified Spark jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/trace-x/spark-jars
          key: spark-jars-${{ hashFiles('packages/trace_core/stream/jars.lock') }}

      - name: Fetch and verify Spark jars
        run: python scripts/stream_jars.py fetch

      # Stream tests that also need a broker or PostgreSQL are integration-marked and run in
      # test-integration, which provisions them; here they would only skip.
      # One pytest session -- one Spark JVM -- per file. The stream session's driver heap is fixed
      # (stream/session.py), and every stream file in one JVM exhausted it locally (a GC death
      # spiral, 2026-09-16 and 2026-09-18); the first CI run of the single session was cancelled at
      # 30 minutes, 72% through. The list is the directory itself, so no file is left out. Each
      # session still fails if nothing executed or anything skipped (tests/conftest.py).
      - name: Stream tests, one JVM per file
        run: |
          status=0
          for file in tests/stream/test_*.py; do
            echo "::group::$file"
            pytest -m "stream and not integration" -v -rs "$file" || status=1
            echo "::endgroup::"
          done
          exit $status
