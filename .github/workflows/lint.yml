name: lint

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # secret scanning needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          bash scripts/install_locked.sh python   # the same script as `make setup`

      - name: ruff format
        run: ruff format --check .

      - name: ruff lint
        run: ruff check --output-format=github .

      - name: mypy (strict on trace_core)
        run: mypy

      - name: bandit
        run: bandit -q -ll -c pyproject.toml -r packages scripts eval migrations

      # Identical to `make secrets`. detect-secrets comes from the hashed lock
      # installed above, so CI runs exactly the version requirements.lock pins.
      # Identical to `make codegen --check` and to the gate in `make verify`.
      - name: Generated event models match their schemas
        run: python scripts/generate_event_models.py --check

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Dependency audit
        # pip-audit comes from the hashed lock installed above; installing it here
        # again would be the one unpinned install in the pipeline.
        run: python -m pip_audit --skip-editable || echo "::warning::pip-audit reported findings"
