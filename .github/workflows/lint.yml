name: lint

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # secret scanning needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,obs]"   # must match `make setup` (mypy scope)

      - name: ruff format
        run: ruff format --check .

      - name: ruff lint
        run: ruff check --output-format=github .

      - name: mypy (strict on trace_core)
        run: mypy

      - name: bandit
        run: bandit -q -ll -c pyproject.toml -r packages scripts eval migrations

      # Identical to `make secrets`. detect-secrets comes from the `dev` extra
      # installed above, so CI uses the version requirements.lock pins -- never a
      # fresh unpinned install, which made CI and local disagree.
      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable || echo "::warning::pip-audit reported findings"
