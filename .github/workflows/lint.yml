name: lint

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # secret scanning needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff format
        run: ruff format --check .

      - name: ruff lint
        run: ruff check --output-format=github .

      - name: mypy (strict on trace_core)
        run: mypy

      - name: bandit
        run: bandit -q -ll -c pyproject.toml -r packages scripts eval

      - name: Secret scan
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files \
            --exclude-files '\.venv/' --exclude-files 'uv\.lock' > /tmp/secrets.json
          python - <<'PY'
          import json, sys
          found = json.load(open("/tmp/secrets.json")).get("results", {})
          if found:
              print("Potential secrets detected:", *found, sep="\n  ")
              sys.exit(1)
          print("No secrets detected.")
          PY

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable || echo "::warning::pip-audit reported findings"
