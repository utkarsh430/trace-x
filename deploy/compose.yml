# ============================================================================
# TRACE-X local stack — PROFILED (ADR-0024)
#
# `core` is a complete working product on its own. Everything else is opt-in,
# because the full stack does not fit alongside a laptop's other work.
#
#   make up              core                (postgres, redis)
#   make up-streaming    core + streaming
#   make up-full         everything          (needs ~15 GB free + 8 GB Docker RAM)
#
# Ports are deliberately non-standard to avoid collisions with other projects.
# Every heavy service declares a memory limit — an unbounded JVM will consume
# the whole VM and OOM-kill its neighbours.
# ============================================================================

name: tracex

x-restart: &restart
  restart: unless-stopped

services:
  # --------------------------------------------------------------- core ----
  postgres:
    image: postgres:16
    profiles: ["core"]
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracex}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-tracex_owner}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env}
      # Deterministic collation so ORDER BY is stable across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Schemas, roles and grants are created by Alembic (`make migrate`), never by
    # an init script. The grants ARE the ground-truth isolation control (ADR-0004)
    # and a control with two definitions can drift. A real deployment (RDS) has no
    # init script either, so this keeps local and cloud on one path.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-tracex_owner} -d ${POSTGRES_DB:-tracex}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    <<: *restart
    # The FEATURE store: correctness-relevant online state, and nothing else
    # (ADR-0044). The replay cache and rate-limit windows live in `redis-cache`
    # below, because eviction policy is per instance and these two classes need
    # opposite policies.
    #
    # `noeviction`, and this is the correctness decision of Phase 2. Under
    # `allkeys-lru` a full store discarded feature keys, and an evicted feature
    # key reads back empty -- indistinguishable from an account with no history
    # -- so the rules abstained and transactions that should have been CRITICAL
    # were approved with degraded=false. A passing acceptance run did exactly
    # that: 346,067 keys evicted, every latency target met, nothing flagged.
    # With `noeviction` a full store REFUSES the write instead, the gateway
    # surfaces it as `feature_write_failed` and deletes its completeness epoch,
    # and every decision from then on says its history is incomplete. Loud is
    # the only acceptable failure mode for state that decides fraud.
    #
    # The memory limit follows from the memory model in
    # benchmarks/features/memory_model.py, not from a guess and not from the
    # first ten minutes of a run; see ADR-0044 for the derivation and the
    # steady-state figure it does NOT fit.
    #
    # AOF OFF, and this is a latency decision with a measurement behind it.
    # ADR-0003 makes Redis authoritative for NOTHING: it holds derived state,
    # rebuildable from Delta, and Phase 3's Gold reconciliation overwrites it.
    # So persistence buys a faster restart with state that is stale on arrival,
    # and `appendfsync everysec` costs periodic fsync stalls on a path with a
    # 100 ms budget and a 20 ms socket timeout. Measured on the representative
    # 500 TPS profile, identical in every other respect:
    #
    #   appendonly yes -> 5,151 Redis timeouts, 51 dropped iterations, p99 32.66 ms
    #   appendonly no  ->     0 timeouts,        0 dropped iterations, p99 12.43 ms
    #
    # A restart therefore empties the store. That is not silent either: the
    # epoch is gone with it, the first write re-establishes one, and decisions
    # carry `history_incomplete` until the store has warmed for the widest
    # declared lookback.
    command: >
      redis-server
      --appendonly no
      --maxmemory 704mb
      --maxmemory-policy noeviction
      --save ""
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          # 704 MiB of data (benchmarks/features/memory_model.py: the ten-minute
          # representative working set projects to ~557 MiB; 1.25x headroom,
          # rounded up to 64 MiB) plus ~18% for Redis's allocator, client
          # buffers and the process itself. A container limit below maxmemory
          # would let the kernel kill Redis before Redis could refuse a write,
          # which is the silent failure `noeviction` exists to replace with a
          # loud one.
          #
          # 1.25x rather than more: ARCHITECTURE §14 budgets the whole `core`
          # profile at 2.7 GB and `api`, `worker` and `ui` have not yet drawn
          # against it. The headroom is validated, not assumed -- the acceptance
          # run records the store's actual end-of-run memory under its run_id,
          # and if that crowds this limit the budget conflict is surfaced rather
          # than the limit quietly raised.
          memory: 832M

  # ---------------------------------------------------------- cache ------
  # A SECOND Redis, for state whose loss costs nothing (ADR-0044).
  #
  # Redis eviction policy is instance-wide, so one instance cannot protect the
  # feature state and still evict the replay cache. Measured on the
  # representative 500 TPS profile, the replay cache was 37% of a shared
  # keyspace at 1,579 bytes per entry, and under allkeys-lru it was FEATURE
  # state that got evicted to make room for it -- an evicted feature key reads
  # back empty, which looks exactly like a new account, so the rules abstained
  # and transactions that should have been CRITICAL were approved with
  # degraded=false. Two instances is what lets each class have the policy its
  # semantics allow: `redis` (features) refuses writes when full and says so;
  # this one evicts freely, because everything in it is either a latency
  # optimisation over an authority that lives in Postgres (idempotent replay;
  # `cases.trigger_transaction_id` is the real guarantee) or fails open by
  # design (rate-limit windows, CLAUDE.md §3.7).
  #
  # Small on purpose. At 500 TPS this holds roughly two and a half minutes of
  # replay entries before LRU starts recycling them; a retry outside that
  # window is re-scored and returns the existing case_id from Postgres rather
  # than the cached body. That is the documented limit of the replay
  # guarantee, not a defect in it, and it is the same limit the shared
  # instance had while also destroying feature state to reach it.
  redis-cache:
    image: redis:7-alpine
    profiles: ["core"]
    <<: *restart
    command: >
      redis-server
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "${REDIS_CACHE_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          # 128 MiB of data plus Redis's own overhead. Measured at the end of a
          # 500 TPS run with the cache at its cap: RSS 150.75 MiB against 128 MiB
          # of data (fragmentation 1.18 under continuous LRU eviction), and the
          # cgroup recorded 52 `memory.max` events at a 160 MiB limit -- each
          # one a direct-reclaim stall inside the cache process. 192 MiB leaves
          # the allocator room to fragment without the kernel getting involved.
          memory: 192M

  gateway:
    # Built from THIS repository, not pulled: the image is the hot path, and a
    # gateway image that could drift from the source tree beside it would make
    # every latency number unattributable (ADR-0017's image_digests field).
    # Context is the repo root because the build needs pyproject.toml, the
    # lockfile, packages/ and services/; `.dockerignore` admits those four and
    # nothing else, so a stray .env or dataset cannot reach a layer.
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    image: tracex-gateway:dev
    profiles: ["core"]
    <<: *restart
    depends_on:
      # Postgres is a hard start-up dependency: triage has no fallback, and a
      # decision that cannot be durably recorded is refused rather than
      # approved (ADR-0035). Redis is service_started, NOT service_healthy --
      # Redis loss is a designed, visible degradation (ARCHITECTURE §18), and
      # gating start-up on its health would turn the one dependency the hot
      # path is built to survive into the one that keeps it down.
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
    environment:
      # Service identity (docs/SECURITY.md §3, Plane B). `:?` rather than a
      # default: the gateway refuses to start without a token, so the choice is
      # between one readable message from `docker compose up` and a container
      # crash-looping on a stack trace. There is no secret in this file -- the
      # value comes from .env, which is gitignored (CLAUDE.md §9).
      TRACE_SERVICE_TOKEN_LOCAL: "${TRACE_SERVICE_TOKEN_LOCAL:?set it in .env (>= 32 characters); the gateway refuses to start without at least one service token}"
      # In-network addresses and IN-CONTAINER ports. The ports in .env
      # (5442, 6389 -- ADR-0024) are what is published to the HOST to avoid
      # collisions; inside this network the containers listen on 5432 and 6379.
      # GatewaySettings builds both DSNs straight from these variables, so
      # inheriting the host values here is a connection refused on every request.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tracex}
      # The app role, which has NO grant on the groundtruth schema (ADR-0004).
      # Naming it explicitly is the point: the gateway must never be handed the
      # superuser or the eval credentials that sit beside it in .env.
      TRACE_APP_DB_USER: ${TRACE_APP_DB_USER:-trace_app}
      TRACE_APP_DB_PASSWORD: ${TRACE_APP_DB_PASSWORD:?set it in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      # The disposable-cache instance (ADR-0044): replay cache and rate-limit
      # windows. Loss of anything in it must not change a decision.
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-0}
      TRACE_ENV: ${TRACE_ENV:-local}
      TRACE_LOG_LEVEL: ${TRACE_LOG_LEVEL:-INFO}
      TRACE_LOG_FORMAT: ${TRACE_LOG_FORMAT:-json}
      TRACE_RATE_LIMIT_PER_MINUTE: ${TRACE_RATE_LIMIT_PER_MINUTE:-1000}
    # Enumerated rather than `env_file: ../.env` on purpose. .env also holds the
    # superuser password, the eval role that CAN read ground truth, and any
    # Kaggle/OpenAI key the developer has added; least privilege (CLAUDE.md §9)
    # says the hot path receives none of them.
    ports:
      - "${TRACE_GATEWAY_PORT:-8010}:8010"
    logging:
      # One structured line per request at 500 TPS is ~75 MB per ten-minute
      # run. Unrotated, that grows without bound on a laptop and every write
      # goes through the daemon's json-file writer, which is on the path of the
      # synchronous stdout write the gateway makes per request. Rotation bounds
      # both. It does not make the write asynchronous; see ADR-0044's note on
      # stall amplification for why that matters.
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # LIVENESS, deliberately -- /healthz touches no dependency. Two distinct
      # reasons not to point this at /readyz:
      #   1. `make up` runs `up -d --wait` and THEN `make migrate`. /readyz
      #      connects as trace_app, a role that only the migration creates, so a
      #      readiness healthcheck would never pass on a fresh clone and `make up`
      #      would hang before the migration that would have fixed it.
      #   2. A probe that fails on a Postgres blip would mark a healthy,
      #      correctly-degrading process unhealthy and restart it.
      # /readyz is the load balancer's question and the operator's
      # (ADR-0035, docs/OPERATIONS.md §2); it is not this one.
      #
      # Probed with the interpreter already in the image rather than curl or
      # wget, neither of which is in python:3.12-slim: a serving image should not
      # grow a network client, and its CVEs, to answer a question about itself.
      test:
        - CMD
        - python
        - -c
        - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/healthz', timeout=2).status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 12
      # Measured: start-up takes ~11 s when Postgres is not yet accepting this
      # role, because the pool's open() waits its full 10 s timeout before the
      # app logs postgres_pool_not_ready and serves anyway (services/gateway/app.py).
      # A shorter start_period would report a gateway that is starting exactly as
      # designed as a failed one.
      start_period: 20s
    deploy:
      resources:
        limits:
          # ARCHITECTURE §14 budgets the whole `core` profile at 2.7 GB
          # (~2765 MiB) across postgres, redis, gateway, api, worker and ui --
          # the 3 MCP servers are stdio and cost no container. Postgres (768M)
          # and redis (640M) already claim 1408M, leaving ~1357M for the four
          # service containers, of which this is the first.
          #
          # 384M is that remainder split with the gateway taking a share above
          # an even quarter, because it is the only one of the four with a
          # connection pool sized for 500 TPS. Measured idle RSS of this image
          # is 58 MiB, so the limit is ~6x headroom for the pool, request
          # concurrency and the metrics registry -- and it still leaves 973M for
          # api, worker and ui, which must fit alongside it.
          memory: 384M

  # ---------------------------------------------------------- streaming ----
  # Phase 3. Topics are DECLARED in deploy/kafka/topics.yaml and created only by
  # `scripts/kafka_topics.py apply --environment local`; this broker never creates
  # one by itself.
  kafka:
    # Pinned by tag AND multi-arch index digest (an OCI index with linux/amd64 and
    # linux/arm64 images): a tag can be moved, a digest cannot (ADR-0036's rule).
    # 3.9.1 is the kafka-clients version Spark 4.0.1 builds against (ADR-0045).
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    profiles: ["streaming"]
    <<: *restart
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners, because an advertised address must be reachable from
      # wherever the client runs: PLAINTEXT for host processes (tests, the
      # generator, a local Spark driver) and INTERNAL for containers on the compose
      # network (the gateway publishes from inside it). With only a localhost
      # listener, a container is told to reconnect to its own loopback.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A defect found by starting this image, not by reading it: once any KAFKA_*
      # variable is set, the image stops using its bundled server.properties and
      # log.dirs falls back to /tmp/kafka-logs, inside the container's writable
      # layer. The volume below stayed empty, so the log was lost on every
      # container recreate and no disk bound applied to the volume at all.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # A topic that does not exist is an error, never a topic created with broker
      # defaults: 1 partition, CreateTime timestamps and no byte cap.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The local disk bound in topics.yaml is derived from the next six settings,
      # and `kafka_topics.py verify` checks every one against the running broker.
      # The defaults are wrong for a bound: a 300 s retention check lets a
      # partition overshoot its cap by five minutes of traffic, deleted segments
      # linger 60 s, metadata segments are 1 GiB and consumer offsets take 50
      # partitions of 100 MiB segments.
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: 10000
      KAFKA_METADATA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_METADATA_MAX_RETENTION_BYTES: 67108864
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 4
      KAFKA_OFFSETS_TOPIC_SEGMENT_BYTES: 8388608
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # kafka-broker-api-versions.sh exits 0 even when it cannot reach a broker at
      # its advertised address -- it prints "-> ERROR" and succeeds (observed on
      # this image) -- so exit status alone proves nothing. This check requires the
      # broker line and fails on any ERROR. It uses the INTERNAL listener, the one
      # containers use; the host-advertised address is not reachable from inside
      # the container whenever KAFKA_PORT is not 9092, so it cannot be checked here.
      test:
        - CMD-SHELL
        - >-
          out=$$(/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 2>&1)
          || exit 1; echo "$$out" | grep -q '(id: 1 rack' || exit 1;
          if echo "$$out" | grep -q -- '-> ERROR'; then exit 1; fi
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          # Unchanged: the heap is 768 MiB, and the idle broker was observed well
          # inside this limit; nothing measured argues for a different value.
          memory: 1280M

  # -------------------------------------------------------------- graph ----
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    <<: *restart
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change_me_locally}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1280M

  # ---------------------------------------------------------------- llm ----
  # SMOKE tier (ADR-0016) — a bare clone runs the demo with NO API key.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    <<: *restart
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
  redisdata:
  kafkadata:
  neo4jdata:
  ollamadata:
