# Alembic configuration.
#
# Alembic is the SINGLE source of truth for schemas, roles, grants and tables
# (ADR-0004). The compose init script previously duplicated the grant logic;
# that duplication was removed, because the grants ARE the ground-truth
# isolation security control and a control with two definitions can drift.
#
# The database URL comes from the environment (migrations/env.py) -- never from
# this file, which is committed.

[alembic]
script_location = migrations
prepend_sys_path = packages
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
